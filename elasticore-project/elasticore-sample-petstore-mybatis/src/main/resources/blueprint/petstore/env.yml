elasticore:
  enable: true
  config:
    domainName: petstore
    framework: springboot
    mode: mybatis               # JPA 대신 MyBatis 매퍼(XML)로 저장한다
    j2ee: jakarta
    apiPath: "/api"             # REST 주소는 /api/petstore/...
    table:
      prefix: ps_
    annotations:
      genid: "genid(io.elasticore.springboot3.util.IdUtils.newId)"
  namespace:
    base: io.elasticore.sample.mybatis.petstore
