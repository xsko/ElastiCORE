spring:
  application:
    name: petstore-mybatis
  datasource:
    url: jdbc:h2:mem:petstore;DB_CLOSE_DELAY=-1
  # MyBatis makes no table: Flyway runs the migrations the generator wrote for
  # the database ({vendor}: h2, postgresql, oracle, sqlserver), then the catalog.
  flyway:
    locations: classpath:db/migration/{vendor},classpath:db/catalog

petstore:
  vat-rate: 5.5        # percent, added to the lines
  discount-rate: 2.25  # percent, taken off the VAT-inclusive amount
  demo-accounts: true  # admin/admin and user/user at start-up

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
