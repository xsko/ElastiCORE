// A PIT plugin the build's mutation gate puts on PIT's classpath (diffMutation in
// gradle/quality.gradle): it keeps only the mutations on the lines a change adds
// or edits. Not published - it is part of how this repository checks itself.

description = 'PIT feature CHANGEDLINES for the mutation gate of a pull request'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    compileOnly "org.pitest:pitest-entry:${pitestVersion}"
    testImplementation "org.pitest:pitest-entry:${pitestVersion}"
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
