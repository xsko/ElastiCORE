import org.gradle.api.tasks.JavaExec

// The domain-model reading of the pipeline, kept where it can be compiled.
//
// elasticore-template proves the Java rules by generating the 2.x sources
// byte for byte; elasticore-template-kt proves the Kotlin ones by compiling
// them. Neither can say whether the DDD bundle produces a Java project that
// still builds, because neither runs it - the golden module has no rules
// configured on purpose, and the Kotlin module composes a different set.
//
// This module runs the DDD bundle over the same shop blueprint the golden
// module uses, so what differs between the two trees is attributable to the
// rules and nothing else.
//
//   ./gradlew :elasticore-project:elasticore-template-ddd:elcore3ddd
//   ./gradlew :elasticore-project:elasticore-template-ddd:elcore3dddVerify

plugins {
	id 'java'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'io.elasticore'
}

// The module is the plugin's first user. What it declares here is what a
// project would declare: two words. The blueprint's env.yml names the same
// bundle per domain, which is the level below this one - a domain deviating
// from the project default is the only reason to write it there.
elasticore {
	architecture = 'hexagonal'
	language = 'java'
	// The tables Hibernate maps - Envers' audit tables among them - for each
	// database (db/schema-{db}.sql), checked by SchemaValidateTest.
	ddl {
		databases = ['h2', 'postgresql', 'oracle', 'sqlserver']
	}
}

// The plugin resolves io.elasticore:elasticore-base at its own version by
// default. Inside this repository that artifact is the module next door and
// has not been published, so the configuration is filled explicitly - which is
// also the escape hatch a project would use to pin a different build.
dependencies {
	elasticore project(':elasticore-project:elasticore-base')
}

group = 'elasticore-template-ddd'
version = '1.0.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:3.3.2'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.15'
	implementation 'org.hibernate:hibernate-envers:6.6.13.Final'

	implementation 'org.projectlombok:lombok:1.18.26'
	annotationProcessor 'org.projectlombok:lombok:1.18.26'

	implementation project(':elasticore-project:elasticore-base')
	implementation project(':elasticore-project:elasticore-springboot3')

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.assertj:assertj-core:3.25.3'
	// shop: archTest - the generated ShopArchitectureTest
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// The module's real claim is that the generated domain model runs, and
	// only a database says so: compiling proves the shape, not the mapping.
	testRuntimeOnly 'com.h2database:h2:2.2.224'
}

def generated = 'src/main/java'

sourceSets {
	main.java.srcDirs += [generated]

	// The gRPC stubs name classes protoc generates from the .proto, and this
	// module runs no protoc - the same reason elasticore-template excludes
	// its own proto output.
	main {
		java {
			exclude '**/proto/**'
			exclude '**/grpc/**'
		}
	}
}

test {
	useJUnitPlatform()
	dependsOn 'elcore3ddd'
	testLogging { events 'passed', 'failed' }
	// As on a server whose machine language is Korean, like the pet store: an
	// error that leaked the machine's language into an English answer shows here.
	jvmArgs '-Duser.language=ko', '-Duser.country=KR'
}

// A verification that reads a stale file is not one. A file carrying the
// generate-once marker survives a rule change and would be checked instead
// of the new output, so the tree is cleared before regenerating.
// Only the generated trees. The hand-written boundary test lives outside
// them (src/test/java/ddd) precisely so that regenerating cannot remove the
// thing that checks the regeneration.
//
// The files rather than the directories: on Windows a handle held on a
// generated tree by the daemon that just compiled it fails a directory
// delete, and the clean is not worth a flaky build.
task elcore3clean(type: Delete) {
	group = 'elasticore'
	description = 'Removes previously generated sources'
	delete fileTree(generated), fileTree('src/test/java/io')
}

// The plugin registers elcore3 and gives it the classpath, the project path,
// the declaration above and the -P pass-throughs. What is left here is what is
// particular to a sample: it always regenerates, so a rule change shows up in
// the tree rather than being skipped as unmodified.
//
// The classpath used to be named as project(':elasticore-project:elasticore-base')
// - a module path written into a task, which is exactly what the plugin exists
// to remove from a user's build.
tasks.named('elcore3') {
	systemProperty 'elasticore.rules.v3', 'true'
	systemProperty 'elasticore.rules.force', 'true'
	dependsOn elcore3clean
}

// The old name, kept so the documented command still works.
task elcore3ddd {
	group = 'elasticore'
	description = 'Generates Java sources through the 3.0 DDD rule bundle'
	dependsOn 'elcore3'
}

// The point of the module: what the DDD rules produce has to compile.
task elcore3dddVerify {
	group = 'elasticore'
	description = 'Generates the DDD sources, compiles them, and runs them'
	// dependsOn rather than finalizedBy: two finalizers in one invocation
	// deadlock Gradle's scheduler, and this module is meant to be runnable
	// alongside the other verification modules in a single command.
	//
	// Compiling proves the shape; the test boots Hibernate over the generated
	// entities and drives the aggregate through a real database.
	dependsOn 'test'
}

// compileJava already depends on elcore3: the plugin wires compilation to the
// generator this project declared. mustRunAfter stays for the alias, which has
// no dependency of its own.
compileJava.mustRunAfter "elcore3"
