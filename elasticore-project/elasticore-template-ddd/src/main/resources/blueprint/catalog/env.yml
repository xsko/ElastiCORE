# A second domain in the same module, read by the plain v3 bundle.
#
# The module's build declares the hexagonal architecture; a domain that names
# its own rules deviates from that, and this one does on purpose: it is where
# jpa-springboot-v3 - the layered, non-DDD reading - is generated, compiled
# and driven over HTTP (CatalogApiTest), so its service is not only a template
# that renders but a program that runs.
elasticore:
  enable: true
  config:
    domainName: catalog
    framework: springboot
    mode: jpa
    j2ee: jakarta
    apiPath: "/api/v1"
    table:
      prefix: cat_
    publisher:
      rules: [jpa-springboot-v3]
    # a bounded context: what another context may use from it
    context:
      publishes: [AuthorDTO, BookDTO]
  namespace:
    entity: io.elasticore.sample.ddd.catalog.entity
    enumeration: io.elasticore.sample.ddd.catalog.entity
    dto: io.elasticore.sample.ddd.catalog.dto
    repository: io.elasticore.sample.ddd.catalog.repository
    service: io.elasticore.sample.ddd.catalog.service
    control: io.elasticore.sample.ddd.catalog.controller
