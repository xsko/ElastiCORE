# A third context, downstream of shop: it reacts to the orders shop places.
#
# Its process manager names shop's event as shop:OrderPlaced - the way a
# field names another domain's type (catalog:Product). The build lets it
# because this context says it uses shop and shop publishes the event; take
# either away and the build fails before any code is written.
elasticore:
  enable: true
  config:
    domainName: billing
    framework: springboot
    mode: jpa
    j2ee: jakarta
    apiPath: "/api/v1"
    table:
      prefix: bill_
    # a bounded context: depends on shop, lets nothing out
    context:
      uses: [shop]
      publishes: []
  # the hexagonal layout, under one package
  namespace:
    base: io.elasticore.sample.ddd.billing
