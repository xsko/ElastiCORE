# A fifth context: a forum whose members sign up by the forum's own code (a mailed code, a social
# sign-in), not through the API - Member's @expose takes no create. The contract tests sign their
# callers in all the same: ForumContractSupport.newSignInRow(role) makes a member of a role the
# forum's way, and the generated sign-in signs it in (elasticore-env-guide.md 6.2.1).
elasticore:
  enable: true
  config:
    domainName: forum
    framework: springboot
    mode: jpa
    j2ee: jakarta
    apiPath: "/api/v1"
    testCode: "contract"
    table:
      prefix: frm_
    context:
      uses: []
      publishes: []
  # the hexagonal layout, under one package
  namespace:
    base: io.elasticore.sample.ddd.forum
