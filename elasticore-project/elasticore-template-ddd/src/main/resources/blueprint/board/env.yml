# A fourth context: a small board, where deleting a post says what becomes of
# what points to it - @onDelete(cascade | restrict | setNull), carried out by
# the deleted root's CoreService (BoardOnDeleteTest).
elasticore:
  enable: true
  config:
    domainName: board
    framework: springboot
    mode: jpa
    j2ee: jakarta
    apiPath: "/api/v1"
    table:
      prefix: brd_
    context:
      uses: []
      publishes: []
  # the hexagonal layout, under one package
  namespace:
    base: io.elasticore.sample.ddd.board
