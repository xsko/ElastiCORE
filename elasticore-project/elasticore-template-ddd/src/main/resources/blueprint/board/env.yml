# A fourth context: a small board, where deleting a post says what becomes of
# what points to it - @onDelete(cascade | restrict | setNull), carried out by
# the deleted root's CoreService (BoardOnDeleteTest).
elasticore:
  enable: true
  config:
    domainName: board
    framework: springboot
    mode: jpa
    j2ee: jakarta
    apiPath: "/api/v1"
    testCode: "contract"
    table:
      prefix: brd_
    context:
      uses: []
      publishes: []
    # A response field written masked (Subscriber.email): the runtime's @Mask, on the DTO only.
    annotations:
      maskemail: "@dto:io.elasticore.springboot3.mask.Mask(io.elasticore.springboot3.mask.MaskType.EMAIL)"
  # the hexagonal layout, under one package
  namespace:
    base: io.elasticore.sample.ddd.board
