enumeration:
  CommentStatus:
    meta: enum @db(code) @json(code)
    fields:
      code:  string(3) @code
      label: string(20)
    enum:
      VISIBLE: VIS, Visible
      HIDDEN:  HID, Hidden

  PostStatus:
    meta: enum @db(code) @json(code)
    fields:
      code:  string(3) @code
      label: string(20)
    enum:
      DRAFT:     DRF, Draft
      PUBLISHED: PUB, Published

  SubscriberStatus:
    meta: enum @db(code) @json(code)
    fields:
      code:  string(3) @code
      label: string(20)
    enum:
      ACTIVE: ACT, Active
      MOVED:  MOV, Moved

entity:
  # Roots of their own, each pointing to the post by its id.
  Post:
    meta: entity @root @expose(20)
    fields:
      postId: long @id @sequence
      title: string(100)! @search(like)
      # From a rich-text editor: kept to an allow-list before it is saved (html, @safe(basic) unsaid), and its
      # text without tags kept beside it for the search (@plain) - no request writes that one.
      content: html @plain(contentText)
      contentText: text @search(like)
      # A post may quote another; deleting the quoted one clears the quote. Versioned: the clearing moves
      # the version of a quoting post the same delete then removes (a search for both).
      quoted: Post @onDelete(setNull)
      version: long @jpa:Version
      # Kept on the post, counted again whenever what is counted changes (@count).
      commentCount: long @count(Comment.post, status == VISIBLE)
      likeCount: long @count(PostLike.post)
      status: PostStatus
    # Published with its final content: the command's parameter is kept by the move, and cleaned like a save.
    states:
      status:
        initial: DRAFT
        publish: DRAFT -> PUBLISHED
    commands:
      publish:
        content: html

  # Deleting a post deletes its comments, and a comment its replies.
  Comment:
    meta: entity @root @expose(20)
    fields:
      commentId: long @id @sequence
      text: string(200)!
      post: Post! @onDelete(cascade)
      parent: Comment @onDelete(cascade)
      status: CommentStatus
    states:
      status:
        initial: VISIBLE
        hide:    VISIBLE -> HIDDEN
        restore: HIDDEN -> VISIBLE

  # A like is a root of its own, holding the post's id.
  PostLike:
    meta: entity @root @expose(20)
    fields:
      likeId: long @id @sequence
      post: Post! @onDelete(cascade)

  # A post or a comment that is reported cannot be deleted.
  Report:
    meta: entity @root @expose(20)
    fields:
      reportId: long @id @sequence
      reason: string(100)
      post: Post @onDelete(restrict)
      comment: Comment @onDelete(restrict)

  # A reader who gets the board's notices. The phone and the e-mail are kept encrypted in their columns
  # (@encrypt: v1:... in the database, the value in the API); the phone is found by an equal one however it is
  # written (@s(eq): its blind index, phone_bidx). The keys are the elasticore.crypto.* properties.
  # @encrypt(digits): 010-1234-5678 and 01012345678 are one phone to the search. A subscriber who moves
  # gives a new phone through the command, and the index follows it when the row is written.
  # The e-mail is also shown masked (@env:maskemail: re****@example.com); sent back as shown, an update keeps it.
  Subscriber:
    meta: entity @root @expose(20)
    fields:
      subscriberId: long @id @sequence
      nickname: string(50)! @search(like)
      phone: string(20) @encrypt(digits) @s(eq)
      email: string(100) @encrypt @env:maskemail
      status: SubscriberStatus
    states:
      status:
        initial: ACTIVE
        move: ACTIVE -> MOVED
    commands:
      move:
        phone: string(20)

  # A bookmark outlives its post: the reference is cleared.
  Bookmark:
    meta: entity @root @expose(20)
    fields:
      bookmarkId: long @id @sequence
      label: string(50)
      post: Post @onDelete(setNull)
