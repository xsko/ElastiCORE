enumeration:
  CommentStatus:
    meta: enum @db(code) @json(code)
    fields:
      code:  string(3) @code
      label: string(20)
    enum:
      VISIBLE: VIS, Visible
      HIDDEN:  HID, Hidden

entity:
  # Roots of their own, each pointing to the post by its id.
  Post:
    meta: entity @root @expose(20)
    fields:
      postId: long @id @sequence
      title: string(100)! @search(like)
      # A post may quote another; deleting the quoted one clears the quote. Versioned: the clearing moves
      # the version of a quoting post the same delete then removes (a search for both).
      quoted: Post @onDelete(setNull)
      version: long @jpa:Version
      # Kept on the post, counted again whenever what is counted changes (@count).
      commentCount: long @count(Comment.post, status is VISIBLE)
      likeCount: long @count(PostLike.post)

  # Deleting a post deletes its comments, and a comment its replies.
  Comment:
    meta: entity @root @expose(20)
    fields:
      commentId: long @id @sequence
      text: string(200)!
      post: Post! @onDelete(cascade)
      parent: Comment @onDelete(cascade)
      status: CommentStatus
    states:
      status:
        initial: VISIBLE
        hide:    VISIBLE -> HIDDEN
        restore: HIDDEN -> VISIBLE

  # A like is a root of its own, holding the post's id.
  PostLike:
    meta: entity @root @expose(20)
    fields:
      likeId: long @id @sequence
      post: Post! @onDelete(cascade)

  # A post or a comment that is reported cannot be deleted.
  Report:
    meta: entity @root @expose(20)
    fields:
      reportId: long @id @sequence
      reason: string(100)
      post: Post @onDelete(restrict)
      comment: Comment @onDelete(restrict)

  # A bookmark outlives its post: the reference is cleared.
  Bookmark:
    meta: entity @root @expose(20)
    fields:
      bookmarkId: long @id @sequence
      label: string(50)
      post: Post @onDelete(setNull)
