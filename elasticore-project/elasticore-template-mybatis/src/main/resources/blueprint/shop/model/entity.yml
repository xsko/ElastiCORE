enumeration:
  OrderStatus:
    meta: enum @db(code) @json(code) -- order status
    fields:
      code: string(1) @code
      name: string(20)
    enum:
      NEW: N,New
      PAID: P,Paid
      SHIPPED: S,Shipped

entity:
  # A tree: a relation to its own table.
  Category:
    meta: entity @expose(20) @access(*=public) -- category
    fields:
      categoryId: long @id @sequence
      name: string(50)! @search(like)
      slug: string(30) @search(_%)
      parent: Category @ManyToOne @search(eq)

  # A key the service makes (@genid), not the database.
  Product:
    meta: entity @expose(20) @access(*=public) -- product
    fields:
      productCode: string(12) @id @genid
      name: string(100)! @search(like)
      price: long! @search(between)
      stock: int @search(<)
      label: string(20) @search
      origin: string(20) @updatable(false)
      rating: int @formula("(select 5)")
      category: Category @ManyToOne @search(eq)

  Customer:
    meta: entity @expose(20) @access(*=public) -- customer
    fields:
      customerId: long @id @sequence
      name: string(50)! @search(like)
      email: string(100) @unique @search(eq)
      grade: int @default(1) @search(>=)
      joinedAt: datetime @jpa:CreatedDate
      changedAt: datetime @jpa:LastModifiedDate

  # Every column type, written and read back alike on each database (TypesTest).
  Gadget:
    meta: entity @expose(20) @access(*=public) -- every column type
    fields:
      gadgetId: long @id @sequence
      name: string(40)! @search(like)
      active: boolean @search(eq)
      weight: double
      ratio: float
      amount: decimal(12.3) @search(between)
      price: money(10.2)
      count: quantity
      notes: text
      body: clob
      image: blob
      madeOn: date
      madeAt: datetime @search(between)
      opensAt: time
      stampedAt: timestamp

  PurchaseOrder:
    meta: entity @expose(20) @access(*=public) -- order
    fields:
      orderId: long @id @sequence
      orderNo: string(20)! @search(in)
      status: OrderStatus! @search(eq)
      amount: long! @search(between)
      orderedAt: datetime @search(between)
      customer: Customer! @ManyToOne @search(eq)
      product: Product @ManyToOne @search(eq)
      memo: string(200) @search(like)
      deliveredAt: datetime @search(isnull)
      version: long @jpa:Version
