# A shop kept in MyBatis rather than JPA: one word, mode.
elasticore:
  enable: true
  config:
    domainName: shop
    framework: springboot
    mode: mybatis
    j2ee: jakarta
    apiPath: "/api"
    # A response field written masked (Gadget.serialNo): the runtime's @Mask, on the DTO only.
    annotations:
      maskcard: "@dto:io.elasticore.springboot3.mask.Mask(io.elasticore.springboot3.mask.MaskType.CARD)"
  namespace:
    base: io.elasticore.sample.mybatis.shop
