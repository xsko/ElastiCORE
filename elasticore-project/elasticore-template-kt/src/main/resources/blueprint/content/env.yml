elasticore:
  enable: true
  config:
    domainName: content
    framework: springboot
    mode: jpa
    j2ee: jakarta
    testCode: "true"
    apiPath: "/api/v1"
    table:
      prefix: cms_
    jpa:
      useQueryMethod: true
    annotations:
      genid: "genid(io.elasticore.springboot3.util.IdUtilsX.newId)"
      stringarray: "@entity:Convert(converter = io.elasticore.springboot3.util.StringArrayConverter::class)"
      integerarray: "@entity:Convert(converter = io.elasticore.springboot3.util.IntegerArrayConverter::class)"
    publisher:
      rules: [jpa-springboot-kt, ddd-aggregate, ddd-reference, ddd-value-object-kt]
  namespace:
    entity: io.elasticore.blueprint.domain.content.entity
    dto: io.elasticore.blueprint.domain.content.dto
    enumeration: io.elasticore.blueprint.domain.content.enums
    repository: io.elasticore.blueprint.domain.content.repository
    service: io.elasticore.blueprint.domain.content.service
    control: io.elasticore.blueprint.domain.content.controller
    port: io.elasticore.blueprint.domain.content.port
