elasticore:
  enable: true
  config:
    domainName: shop
    framework: springboot
    mode: jpa
    j2ee: jakarta
    testCode: "true"
    apiPath: "/api/v1"
    outbox: true
    table:
      prefix: shop_
    jpa:
      useQueryMethod: true
    annotations:
      genid: "genid(io.elasticore.springboot3.util.IdUtils.newId)"
      stringarray: "@entity:Convert(converter = io.elasticore.springboot3.util.StringArrayConverter::class)"
      integerarray: "@entity:Convert(converter = io.elasticore.springboot3.util.IntegerArrayConverter::class)"
    publisher:
      # The Kotlin hexagon: the same reading the Java sample asks for, in
      # the other language. What differs is only what the language decides -
      # the value object is immutable by declaration here, not by Lombok.
      rules: [hexagonal-springboot-kt]
  namespace:
    entity: io.elasticore.blueprint.domain.shop.entity
    dto: io.elasticore.blueprint.domain.shop.dto
    enumeration: io.elasticore.blueprint.domain.shop.enums
    repository: io.elasticore.blueprint.domain.shop.infrastructure
    domainRepository: io.elasticore.blueprint.domain.shop.repository
    persistence: io.elasticore.blueprint.domain.shop.infrastructure
    service: io.elasticore.blueprint.domain.shop.service
    control: io.elasticore.blueprint.domain.shop.adapter.in.web
    port: io.elasticore.blueprint.domain.shop.port
    event: io.elasticore.blueprint.domain.shop.event
    domainService: io.elasticore.blueprint.domain.shop.domainservice
