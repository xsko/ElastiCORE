// The domain model and the hexagon over MyBatis, kept where they can be
// compiled and run.
//
// The shop blueprint of elasticore-template-ddd, with mode: mybatis: the same
// aggregates, events, invariants, commands, lifecycles, ports and process
// managers, written over MyBatis mappers instead of JPA. What JPA did for an
// aggregate by itself - cascade to its members and remove their orphans,
// count the version up, call the callbacks, publish the domain events - the
// generated repository adapter does, and the tests here drive it through the
// API and the ports on H2, and on Oracle, PostgreSQL and SQL Server (dbTest).
//
//   ./gradlew :elasticore-project:elasticore-template-ddd-mybatis:test

plugins {
	id 'java'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'io.elasticore'
}

elasticore {
	// shop is the hexagon; billing names the domain-model reading (ddd) and
	// catalog the layered one in their env.yml.
	architecture = 'hexagonal'
	language = 'java'
	ddl {
		databases = ['h2', 'postgresql', 'oracle', 'sqlserver']
	}
}

dependencies {
	elasticore project(':elasticore-project:elasticore-base')
}

group = 'elasticore-template-ddd-mybatis'
version = '1.0.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.16'
	}
}

dependencies {
	// What a MyBatis project declares: MyBatis and Spring Data's paging types,
	// and no JPA - the runtime library must not bring it either.
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	implementation 'org.springframework.data:spring-data-commons'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	implementation 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'

	implementation project(':elasticore-project:elasticore-base')
	implementation project(':elasticore-project:elasticore-springboot3')

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// shop: archTest - the generated ShopArchitectureTest
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	// The databases dbTest runs on.
	testRuntimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.oracle.database.jdbc:ojdbc11'
	testRuntimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
}

def generated = 'src/main/java'

sourceSets {
	main.java.srcDirs += [generated]

	// The gRPC stubs name classes protoc generates from the .proto, and this
	// module runs no protoc.
	main {
		java {
			exclude '**/proto/**'
			exclude '**/grpc/**'
		}
	}
}

test {
	useJUnitPlatform {
		excludeTags 'database'
	}
	testLogging { events 'passed', 'failed' }
	jvmArgs '-Duser.language=ko', '-Duser.country=KR'
}

// The same tests on Oracle, PostgreSQL and SQL Server: each class runs where
// its ELASTICORE_IT_{ORACLE|POSTGRESQL|SQLSERVER}_URL is set (CI starts the
// three), in a schema of its own made for the run.
tasks.register('dbTest', Test) {
	group = 'verification'
	description = 'Runs the shop on the databases ELASTICORE_IT_* name'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'database'
	}
	testLogging { events 'passed', 'skipped', 'failed' }
	jvmArgs '-Duser.language=ko', '-Duser.country=KR'
}

// A run that reads a stale file checks nothing: the generated trees are
// cleared first, files rather than directories (a handle on Windows).
task elcore3clean(type: Delete) {
	group = 'elasticore'
	description = 'Removes previously generated sources'
	delete fileTree(generated), fileTree('src/test/java/io'), fileTree('src/main/resources/io'),
			fileTree('src/main/resources/db')
}

tasks.named('elcore3') {
	systemProperty 'elasticore.rules.force', 'true'
	dependsOn elcore3clean
}

// processResources copies the mapper XML and the schema the generator writes.
tasks.named('processResources') {
	dependsOn 'elcore3'
}
