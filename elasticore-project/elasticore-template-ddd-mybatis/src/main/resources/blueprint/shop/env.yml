# The same shop DSL the Java template generates, read as a domain model.
#
# Only two things differ from elasticore-template/blueprint/shop/env.yml:
# the rule bundle, and where each artifact lands. Everything the entities
# themselves say is unchanged - which is the point. A domain model is a
# reading of the same declarations, not a second set of them.
elasticore:
  enable: true
  config:
    domainName: shop
    framework: springboot
    mode: mybatis
    j2ee: jakarta
    supportAI: false
    testCode: "true"
    apiPath: "/api/v1"
    # domain events leave through a transactional outbox
    outbox: true
    # and the hexagon's boundaries are an ArchUnit test (ShopArchitectureTest)
    archTest: true
    # a bounded context: takes nothing from catalog, lets out one event -
    # billing reacts to it (a type or an event taken across without being
    # declared fails the build)
    context:
      uses: []
      publishes: [OrderPlaced]
    table:
      prefix: shop_
    jpa:
      useQueryMethod: true
    annotations:
      genid: "genid(io.elasticore.springboot3.util.IdUtils.newId)"
      stringarray: "@entity:Convert(converter = io.elasticore.springboot3.util.StringArrayConverter.class)"
      integerarray: "@entity:Convert(converter = io.elasticore.springboot3.util.IntegerArrayConverter.class)"
    publisher:
      # Everything the v3 bundle produces, minus what an aggregate boundary
      # says should not exist, plus what it says a root must enforce.
      rules: [hexagonal-springboot, ossie-export]
  # Layering is configuration, not a rule. An artifact's package is named per
  # artifact, so the layers a domain model is usually drawn in are had by
  # saying where each one goes - nothing has to be generated differently.
  namespace:
    entity: io.elasticore.sample.dddmybatis.shop.domain.model
    enumeration: io.elasticore.sample.dddmybatis.shop.domain.model
    # Spring Data lives in infrastructure. The domain owns an interface
    # instead - see domainRepository - so the innermost layer names no
    # persistence type, which is the whole of what the inversion buys.
    repository: io.elasticore.sample.dddmybatis.shop.infrastructure.persistence
    domainRepository: io.elasticore.sample.dddmybatis.shop.domain.repository
    persistence: io.elasticore.sample.dddmybatis.shop.infrastructure.persistence
    # Domain events are the domain's, so they sit beside the model rather
    # than in the layer that happens to handle them.
    event: io.elasticore.sample.dddmybatis.shop.domain.event
    # A domain service is domain code, so it does not sit in the
    # application layer beside the use cases.
    domainService: io.elasticore.sample.dddmybatis.shop.domain.service
    service: io.elasticore.sample.dddmybatis.shop.application
    dto: io.elasticore.sample.dddmybatis.shop.application.dto
    control: io.elasticore.sample.dddmybatis.shop.interfaces.rest
    # The port artifact is the INTERFACE - the adapter is a runtime proxy and
    # has no generated code - so it belongs on the application side of the
    # hexagon, not in infrastructure. Naming it "out" states its direction:
    # these are the ports the application drives, not the ones that drive it.
    # The two directions, named the same way. An inbound port is what the
    # application is entered through; an outbound port is what it reaches
    # out with - a dbms or http declaration, whose adapter is a runtime
    # proxy rather than generated code.
    inboundPort: io.elasticore.sample.dddmybatis.shop.application.port.in
    # The application's own searches, beside the other outbound ports. The
    # application service reaches storage only through ports, so nothing in
    # application/ imports infrastructure/.
    queryPort: io.elasticore.sample.dddmybatis.shop.application.port.out
    port: io.elasticore.sample.dddmybatis.shop.application.port.out
