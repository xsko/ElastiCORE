# A third context, downstream of shop: it reacts to the orders shop places.
#
# Its listener (billing.application.ReceiptingListener, written by hand)
# imports shop's OrderPlacedEvent: this context says it uses shop, and shop
# publishes the event.
elasticore:
  enable: true
  config:
    domainName: billing
    framework: springboot
    mode: mybatis
    j2ee: jakarta
    apiPath: "/api/v1"
    testCode: "contract"
    table:
      prefix: bill_
    # the domain-model reading, beside shop's hexagon: no use-case ports
    publisher:
      rules: [ddd-springboot]
    # a bounded context: depends on shop, lets nothing out
    context:
      uses: [shop]
      publishes: []
  # the hexagonal layout, under one package
  namespace:
    base: io.elasticore.sample.dddmybatis.billing
