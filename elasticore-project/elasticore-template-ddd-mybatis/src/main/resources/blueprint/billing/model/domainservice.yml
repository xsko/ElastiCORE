# A process manager that reacts to another context's event.
#
# shop:OrderPlaced is shop's Order root and its Placed event. It runs after
# shop's transaction has committed, in billing's own transaction.
processManager:
  Receipting:
    desc: 주문이 들어오면 영수증을 한 장 만든다
    on: [shop:OrderPlaced]
    uses: [Receipt]
