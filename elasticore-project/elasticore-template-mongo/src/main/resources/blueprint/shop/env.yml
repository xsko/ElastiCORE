# A shop kept in MongoDB rather than a relational database: one word, mode.
elasticore:
  enable: true
  config:
    domainName: shop
    framework: springboot
    mode: mongo
    j2ee: jakarta
    apiPath: "/api"
    # A response field written masked (Customer.email): the runtime's @Mask, on the DTO only.
    annotations:
      maskemail: "@dto:io.elasticore.springboot3.mask.Mask(io.elasticore.springboot3.mask.MaskType.EMAIL)"
  namespace:
    base: io.elasticore.sample.mongo.shop
