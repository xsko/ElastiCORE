# What the shop does not ask for, in Kotlin over MongoDB: signing in, an owner's
# documents, a key the service makes, money, html and every search condition.
elasticore:
  enable: true
  config:
    domainName: club
    framework: springboot
    mode: mongo
    j2ee: jakarta
    apiPath: "/api"
  namespace:
    base: io.elasticore.sample.ktmongo.club
