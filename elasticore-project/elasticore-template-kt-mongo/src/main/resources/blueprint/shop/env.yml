# The MongoDB shop of elasticore-template-mongo, generated in Kotlin: one word, mode,
# and the build's language = 'kotlin'.
elasticore:
  enable: true
  config:
    domainName: shop
    framework: springboot
    mode: mongo
    # the contract tests of what the DSL declares, over the API - on the server ELASTICORE_IT_MONGODB_URI names
    testCode: "contract"
    j2ee: jakarta
    apiPath: "/api"
    # A response field written masked (Customer.email): the runtime's @Mask, on the DTO only.
    annotations:
      maskemail: "@dto:io.elasticore.springboot3.mask.Mask(io.elasticore.springboot3.mask.MaskType.EMAIL)"
  namespace:
    base: io.elasticore.sample.ktmongo.shop
