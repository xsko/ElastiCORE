plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.elasticore.springboot3'
description = 'Spring Boot 3 Common Library'

// The WebClient codecs, and where in a request body a value was refused, are
// the places the Jackson generation shows: this module's are Jackson 2,
// elasticore-springboot4 brings Jackson 3 ones.
sourceSets.main.java.srcDir 'src/jackson2/java'
// Tests that need Jackson 2's own annotations (a generated enum's
// CustomDeserializer); elasticore-springboot4 does not run them.
sourceSets.test.java.srcDir 'src/jackson2test/java'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
    withSourcesJar()  // 소스 코드 포함
    withJavadocJar()  // Javadoc 포함
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}



repositories {
    mavenCentral()
}

dependencies {
    // Every version Spring Boot manages comes from its last 3.x release, as in
    // elasticore-springboot4 from 4.x; the application's own Spring Boot version
    // decides at run time. Versions pinned here went into the published POM -
    // Spring 6.1.2, Netty 4.1.94, Jackson 2.13 - security fixes and all missing.
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')

    implementation project(':elasticore-project:elasticore-base')

    api 'org.springframework:spring-context'
    api 'org.springframework:spring-beans'
    api 'org.springframework:spring-web'


    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'jakarta.persistence:jakarta.persistence-api'
    // Only compiled against: BeanValidation checks for a provider at run time
    // and does nothing where the application has none.
    compileOnly 'jakarta.validation:jakarta.validation-api'
    // Only compiled against: the session-based CurrentUser signs in through the
    // request, and an application without a servlet container never calls it.
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    // Only compiled against: the API error answers (RequestShapeErrors) and the
    // request's language (ErrorMessages) name Spring MVC's exceptions and its
    // locale resolver. A servlet application has it; a WebFlux one never loads them.
    // compileOnly is not published, so the POM does not change.
    compileOnly 'org.springframework:spring-webmvc'
    // RunAsSystemExtension, for the generated service tests; a project has JUnit on its test path.
    compileOnly 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework:spring-webmvc'
    testImplementation 'jakarta.validation:jakarta.validation-api'
    testImplementation 'org.hibernate.validator:hibernate-validator'
    testImplementation 'org.apache.tomcat.embed:tomcat-embed-el'

    implementation 'org.reflections:reflections:0.10.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'io.projectreactor:reactor-core'
    implementation 'io.netty:netty-handler'

    implementation 'org.apache.commons:commons-jexl3:3.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    // nano ID
    api 'com.aventrix.jnanoid:jnanoid:2.0.0'

    // 테스트 관련
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'

    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'
    // An HTTPS MockWebServer with a certificate nobody trusts (MultipartTlsTest)
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.11.0'
    testImplementation 'org.springframework:spring-test:5.3.30'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'

    // 테스트에 필요한 Spring 관련 의존성
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // The DBMS port's sort is checked against a real database
    testRuntimeOnly 'com.h2database:h2'
    // The launcher of the JUnit the Boot BOM picks; Gradle's own is older and the
    // two refuse to discover tests together.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


// Test configuration inherited from root build.gradle

// The language an API error is said in, on a server whose machine language is
// Korean - the case the default must not leak into. A JVM of its own: the JDK
// and Hibernate Validator cache bundles by locale, so the machine language
// cannot be switched in the middle of a run.
def koreanServerTest = tasks.register('koreanServerTest', Test) {
    description = 'Runs the *OnAKoreanServerTest classes on a JVM whose default locale is ko_KR.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    // The application's own ValidationMessages (an English base file and a
    // Korean one) only here: on the main test path they would change the
    // built-in NotBlank wording for every other test.
    classpath = files('src/koreanServerTest/resources') + sourceSets.test.runtimeClasspath
    jvmArgs '-Duser.language=ko', '-Duser.country=KR'
    filter { includeTestsMatching '*OnAKoreanServerTest' }
}
test {
    filter { excludeTestsMatching '*OnAKoreanServerTest' }
    dependsOn koreanServerTest
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // 🔹 from components.java 중복 추가 방지
            if (components.findByName("java") != null) {
                from components.java
            } else {
                throw new GradleException("components.java not found. Ensure 'java-library' plugin is applied correctly.")
            }
            artifactId = 'elasticore-springboot3'


        }
    }

    // Where to publish is the publisher's to say: -P flags or the
    // user's ~/.gradle/gradle.properties, never a file in this repository.
    // Without elasticorePublishUrl there is no such repository; publishToMavenLocal
    // and the Maven Central bundle (centralBundle, gradle/publishing.gradle) still work.
    def publishUrl = project.findProperty('elasticorePublishUrl')
    if (publishUrl) {
        repositories {
            maven {
                name = 'release'
                url = publishUrl
                credentials {
                    username = project.findProperty('elasticorePublishUsername')
                    password = project.findProperty('elasticorePublishPassword')
                }
            }
        }
    }
}

// POM metadata and signing, shared by every published artifact
apply from: rootProject.file('gradle/publishing.gradle')
