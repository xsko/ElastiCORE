// The YAPS pet store: a whole application on the 3.0 hexagonal bundle and
// Spring Boot 4, kept in the build so every change to the generator is
// generated, compiled and run against it.
//
// The template modules prove the generated code compiles and maps; this one
// proves an application built on it works - sign-in, ownership, prices the
// server sets, a browser client typed from the same model. Every defect it
// has turned up so far appeared only when an application was built.
//
//   ./gradlew :elasticore-project:elasticore-sample-petstore:test
//   ./gradlew :elasticore-project:elasticore-sample-petstore:run       (http://localhost:8080)
//   ./gradlew :elasticore-project:elasticore-sample-petstore:webBuild  (needs Node.js)

plugins {
	id 'java'
	id 'application'
	id 'io.elasticore'
}

elasticore {
	architecture = 'hexagonal'
	language = 'java'
	// Read off the Spring Boot Gradle plugin in a project; this build's
	// Gradle predates the Boot 4 plugin, so it is said here.
	springBoot = '4'
	// The model as an Apache Ossie semantic model too: blueprint/semantic_model.yml
	rules = ['ossie-export']
}

dependencies {
	elasticore project(':elasticore-project:elasticore-base')
}

group = 'elasticore-sample-petstore'
version = '1.0.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// What the Spring Boot plugin would set: unnamed @PathVariable/@RequestParam.
	options.compilerArgs << '-parameters'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
	annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
	testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	implementation project(':elasticore-project:elasticore-base')
	implementation project(':elasticore-project:elasticore-springboot4')

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
	mainClass = 'io.elasticore.sample.petstore.PetstoreApplication'
}

// Always regenerated, so a rule change shows up here rather than being
// skipped as unmodified. The developer's own files carry the generate-once
// marker and are left alone.
tasks.named('elcore3') {
	systemProperty 'elasticore.rules.force', 'true'
}

test {
	useJUnitPlatform()
	testLogging { events 'failed' }
	// The tests run as on a server whose machine language is Korean: an error
	// that leaked the machine's language into an English answer shows here.
	jvmArgs '-Duser.language=ko', '-Duser.country=KR'
}

// The browser side: the client generated into src/main/ts and the pages in
// web/ that use it, bundled into static/app.js. Not part of check - it needs
// Node.js - but the CI job that has Node runs it, and the type check in it is
// what proves the generated client matches the pages.
def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
def webInstall = tasks.register('webInstall', Exec) {
	group = 'build'
	description = 'Installs the web build tools'
	workingDir 'web'
	commandLine npm, 'ci', '--no-audit', '--no-fund'
	inputs.file('web/package-lock.json')
	outputs.dir('web/node_modules')
}
tasks.register('webBuild', Exec) {
	group = 'build'
	description = 'Type-checks and bundles the pages against the generated TypeScript client'
	dependsOn webInstall, 'elcore3ts'
	workingDir 'web'
	commandLine npm, 'run', 'build'
	inputs.dir('web/src')
	inputs.dir('src/main/ts')
	outputs.files('src/main/resources/static/app.js', 'src/main/resources/static/app.js.map')
}
