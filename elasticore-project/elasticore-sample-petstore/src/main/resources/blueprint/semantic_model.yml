metrics:
  - name: revenue
    expression:
      sql: "SUM(CASE WHEN PurchaseOrder.status <> 'CAN' THEN PurchaseOrder.total END)"
    description: "매출 (취소 제외, VAT 포함·할인 후 금액)"
    datatype: Decimal
    ai_context:
      synonyms: ["sales", "매출액"]
    custom_extensions:
      - vendor_name: ELASTICORE
        data: "{\"domain\": \"petstore\", \"declared\": \"sum(PurchaseOrder.total) where status != CANCELLED @terms(sales, 매출액) -- 매출 (취소 제외, VAT 포함·할인 후 금액)\"}"
  - name: orderCount
    expression:
      sql: "COUNT(CASE WHEN PurchaseOrder.status <> 'CAN' THEN 1 END)"
    description: "주문 수 (취소 제외)"
    datatype: Integer
    ai_context:
      synonyms: ["orders", "주문 건수"]
    custom_extensions:
      - vendor_name: ELASTICORE
        data: "{\"domain\": \"petstore\", \"declared\": \"count(PurchaseOrder) where status != CANCELLED @terms(orders, 주문 건수) -- 주문 수 (취소 제외)\"}"
  - name: averageOrder
    expression:
      sql: "(SUM(CASE WHEN PurchaseOrder.status <> 'CAN' THEN PurchaseOrder.total END)) / NULLIF((COUNT(CASE WHEN PurchaseOrder.status <> 'CAN' THEN 1 END)), 0)"
    description: "주문 1건 평균 금액"
    datatype: Decimal
    ai_context:
      synonyms: ["AOV", "객단가"]
    custom_extensions:
      - vendor_name: ELASTICORE
        data: "{\"domain\": \"petstore\", \"declared\": \"revenue / orderCount @terms(AOV, 객단가) -- 주문 1건 평균 금액\"}"
  - name: shippedOrders
    expression:
      sql: "COUNT(CASE WHEN PurchaseOrder.status = 'SHP' THEN 1 END)"
    description: "배송된 주문 수"
    datatype: Integer
    custom_extensions:
      - vendor_name: ELASTICORE
        data: "{\"domain\": \"petstore\", \"declared\": \"count(PurchaseOrder) where status = SHIPPED -- 배송된 주문 수\"}"
  - name: cancelledOrders
    expression:
      sql: "COUNT(CASE WHEN PurchaseOrder.status = 'CAN' THEN 1 END)"
    description: "취소된 주문 수"
    datatype: Integer
    custom_extensions:
      - vendor_name: ELASTICORE
        data: "{\"domain\": \"petstore\", \"declared\": \"count(PurchaseOrder) where status = CANCELLED -- 취소된 주문 수\"}"
  - name: customerCount
    expression:
      sql: "COUNT(CASE WHEN Customer.role = 'U' THEN 1 END)"
    description: "고객 수 (관리자 제외)"
    datatype: Integer
    ai_context:
      synonyms: ["members", "회원 수"]
    custom_extensions:
      - vendor_name: ELASTICORE
        data: "{\"domain\": \"petstore\", \"declared\": \"count(Customer) where role = USER @terms(members, 회원 수) -- 고객 수 (관리자 제외)\"}"
custom_extensions:
  - vendor_name: ELASTICORE
    data: "{\"generator\": \"ElastiCORE\", \"domains\": [\"petstore\"]}"
