dto:
  PurchaseOrderDTO:
    meta: dto @template(PurchaseOrder)

  OrderLineDTO:
    meta: dto @template(OrderLine)
    fields:
      itemName: string @ref(item.name)          # 응답에 품목 이름

  ItemDTO:
    meta: dto @template(Item)
    fields:
      productName: string @ref(product.name)    # 응답에 상품 이름

  ProductSrchDTO:
    meta: dto @searchable(entity=Product, pageSize=20)
    fields:
      keyword: string(50) @search(words:name, description, category.name)   # 검색창 하나: 모든 단어가 상품 이름·설명·분류 이름 중 어디엔가
      productId: long @search(eq)
      description: string @search
      categoryId: long @search(eq)
