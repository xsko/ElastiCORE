entity:

  # ---- catalog: reference data, edited by the shop ----------------------

  Category:
    meta: entity @root @editable @expose(20) @access(read=public) -- 분류 (Fish, Dogs ...)
    fields:
      categoryId:  long @id @sequence
      name:        string(30)! @search(like)
      description: string(3000)!

  Product:
    meta: entity @root @editable @expose(20) @access(read=public) @sort(name+) -- 상품 (Angelfish, Bulldog ...)
    fields:
      productId:   long @id @sequence
      name:        string(30)! @search(like)
      description: string(3000)!
      category:    Category @ManyToOne         # -> categoryId

  Item:
    meta: entity @root @editable @expose(50) @access(read=public) @terms(pet, 반려동물, 상품) -- 판매 단위 (Large, Male Puppy ...)
    fields:
      itemId:      long @id @sequence
      name:        string(30)! @search(like)
      description: string(3000)!
      imagePath:   string(100)
      unitCost:    money(10.2)! @min(0.01, 'price must be positive') @terms(price, 가격)
      product:     Product @ManyToOne          # -> productId

  Country:
    meta: entity @root @editable @expose(300) @access(read=public) -- 국가
    fields:
      isoCode:       string(2) @id
      name:          string(80)! @search(like)
      printableName: string(80)!

  # ---- value types ---------------------------------------------------------

  Address:
    meta: entity @embeddable -- 주소
    fields:
      street1:     string(50)!
      street2:     string(50)
      city:        string(50)!
      state:       string(50)
      zipcode:     string(10)!
      countryCode: string(2)!

  CreditCard:
    meta: entity @embeddable -- 결제 카드
    fields:
      creditCardNumber:  string(30)! @writeonly     # accepted, never sent back
      creditCardType:    CreditCardType!
      creditCardExpDate: string(5)!                 # MM/YY

  # ---- customers -------------------------------------------------------------

  Customer:
    # 가입은 누구나, 읽기·수정은 본인(과 관리자), 삭제는 관리자
    meta: entity @root @editable @expose(20) @signin @owner(customerId) @access(read=owner, create=public, update=owner) @terms(member, 회원, 손님)
          @Index(name="uk_ps_customer_login", columnList="login", unique="true") -- 고객
    fields:
      customerId:  long @id @sequence
      login:       string(10)! @search(eq) @login
      password:    string(255)! @password        # 저장은 해시로만, 응답·검색에 없음
      firstName:   string(50)! @search(like)
      lastName:    string(50)! @search(like)
      telephone:   string(30)
      email:       string(100) @email
      dateOfBirth: date @past
      role:        UserRole @default(UserRole.USER) @access(admin)   # 관리자만 바꿈
      homeAddress: Address! @Embedded             # 집 주소는 필수 (기본 배송지)

  # ---- orders -----------------------------------------------------------------

  PurchaseOrder:
    # 주문은 로그인한 고객이 자기 것으로, 조회·취소는 본인, 배송·삭제는 관리자
    meta: entity @root @expose(20) @event(Placed(total), Shipped, Cancelled) @owner(customerId)
          @access(read=owner, create=user, cancel=owner) @terms(order, purchase, 구매) -- 주문
    fields:
      orderId:         string(36) @id @genid
      customer:        Customer @ManyToOne                 # -> customerId
      orderDate:       date @behavior
      status:          OrderStatus
      deliveryAddress: Address @Embedded
      creditCard:      CreditCard! @Embedded
      totalWithoutVat: money(12.2) @default(0) @compute(sum(lines.subTotal))
      vatRate:         decimal(5.2) @default(0) @behavior
      vat:             money(12.2) @default(0) @behavior
      discountRate:    decimal(5.2) @default(0) @behavior
      discount:        money(12.2) @default(0) @behavior
      total:           money(12.2) @default(0) @behavior
      lines:           List<OrderLine> @OneToMany(mappedBy="order") @dtype(List<OrderLineDTO>) @minsize(1, 'the cart is empty')
      version:         long @jpa:Version
    states:                     # 주문의 생명주기: 명령마다 어디서 어디로
      status:
        initial: PLACED
        ship:    PLACED -> SHIPPED
        cancel:  PLACED -> CANCELLED
        delete:  CANCELLED      # 지울 수 있는 상태: 취소된 주문만

  OrderLine:
    meta: entity @behavior -- 주문 줄
    fields:
      lineId:   string(36) @id @genid
      order:    PurchaseOrder @ManyToOne
      item:     Item @ManyToOne                  # -> itemId
      quantity: quantity! @min(1)
      unitCost: money(10.2) @snapshot(item.unitCost)   # 주문 당시 가격을 복사해 둠
      subTotal: money(12.2) @compute(unitCost * quantity)
