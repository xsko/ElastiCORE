import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.compile.JavaCompile

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'io.elasticore'
}

// This module is the golden tree: what it generates must equal what 2.x
// generated, byte for byte. Since 3.0.261028-rc3 a build that says nothing gets
// the 3.0 code, so it says what every project keeping 2.x's code says:
// output = 'v2' - the build then runs the 2.x generator, and elcore3 run here
// by hand writes the 2.x-compatible code that elcoreRulesCheck compares.
// Without it, the generator would find the 2.x code here and stop.
elasticore {
	output = 'v2'
	// The tables the 2.x code maps - many-to-many join tables, a key of two
	// fields, JSON and XML columns, Envers' audit tables - for each database
	// (db/schema-{db}.sql), checked by SchemaValidateTest.
	ddl {
		databases = ['h2', 'postgresql', 'oracle', 'sqlserver']
	}
}

// Inside this repository elasticore-base is the module next door rather than a
// published artifact, so the configuration the plugin would resolve is filled
// explicitly.
dependencies {
	elasticore project(':elasticore-project:elasticore-base')
}



group = 'elasticore-template'
version = '1.0.0-SNAPSHOT'
java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}



dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-logging'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.15'

	implementation 'org.hibernate:hibernate-envers:6.6.13.Final'
	implementation 'org.hibernate:hibernate-core:6.6.13.Final'
	implementation 'org.reflections:reflections:0.10.2'
	
	// gRPC dependencies
	implementation 'io.grpc:grpc-netty-shaded:1.60.0'
	implementation 'io.grpc:grpc-protobuf:1.60.0'
	implementation 'io.grpc:grpc-stub:1.60.0'
	implementation 'com.google.protobuf:protobuf-java:3.25.1'



	implementation 'org.projectlombok:lombok:1.18.26'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'mysql:mysql-connector-java:8.0.23'


	implementation project(':elasticore-project:elasticore-base')
	implementation project(':elasticore-project:elasticore-springboot3')
	annotationProcessor project(':elasticore-project:elasticore-base')
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testImplementation 'org.mockito:mockito-core:5.11.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
	testImplementation 'org.assertj:assertj-core:3.25.3'

	// Spring dependencies required for tests
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	
	// H2 embedded database for testing
	testRuntimeOnly 'com.h2database:h2:2.2.224'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'


	implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.9.1'
}


compileJava.doFirst {
	//new File("${projectDir}/src/main/java/io/elasticore/meta/Mark.java").delete()
}




def generated = 'src/main/java'


tasks.withType(JavaCompile) {
	options.compilerArgs += ["-AprojectPath=$projectDir", "-AgeneratedPath=$generated"]
	//options.getGeneratedSourceOutputDirectory().set(file(generated))
}


sourceSets {
	main.java.srcDirs += [generated]
	//main.java.srcDirs  generated

	// Exclude proto directory until protobuf files are generated
	main {
		java {
			exclude '**/proto/**'
		}
	}
}




task genModel(type: JavaExec) {
	println "genModel"
	classpath = project(':elasticore-project:elasticore-base').sourceSets.main.runtimeClasspath
	mainClass = 'io.elasticore.base.extract.ModelExtractor'
	args "$projectDir/src/main/java"

	doLast {

	}
}

// elcore comes from the plugin now: the classpath, the source root, the
// project path, -Pmode, -Pdomain and the console the wizard reads from are all
// its doing. What was here was the same twenty lines a user copies, including
// the module path written into the task that the plugin exists to remove.
tasks.named('elcore') {
	description = 'ElastiCORE model extraction - supports -Pmode=valid|clean and -Pdomain=<name>[,<name>...]'

	doFirst {
		println 'Running ElastiCORE model extraction...'
	}
}

// Prototype (3.0): verifies the NEW rule-based pipeline against the sources
// generated by the EXISTING elcore pipeline, without writing any file.
// The elcore task above stays untouched.
//   ./gradlew elcoreRulesCheck [-Pdomain=content] [-Pstrict] [-Pverbose]
task elcoreRulesCheck(type: JavaExec) {
	group = 'elasticore'
	description = 'Compares rule-engine output with existing generated sources (3.0 prototype)'

	classpath = project(':elasticore-project:elasticore-base').sourceSets.main.runtimeClasspath
	mainClass = 'io.elasticore.base.model.pub.rules.verify.RulesVerifyRunner'
	args "$projectDir/src/main/java"
	systemProperty 'elasticore.base.path', "$projectDir"

	if (project.hasProperty('domain')) {
		systemProperty 'elasticore.domain', project.property('domain')
	}
	if (project.hasProperty('strict')) {
		systemProperty 'elasticore.rules.strict', 'true'
	}
	if (project.hasProperty('verbose')) {
		systemProperty 'elasticore.rules.verbose', 'true'
	}
}

// Every file 2.x generated, against the file the rule engine writes in its
// place. elcoreRulesCheck compares seven kinds in memory; this one starts
// from the committed tree, so a kind the rule engine never writes (a mapper,
// a composite key class, a core service) shows up as missing.
// The rule engine writes into build/tree-check, never over the golden tree.
//   ./gradlew elcoreTreeCheck
def treeCheckRoot = layout.buildDirectory.dir('tree-check').get().asFile
task elcoreTreeGenerate(type: JavaExec) {
	group = 'elasticore'
	description = 'Generates the whole tree through the rule engine into build/tree-check'
	doFirst {
		delete treeCheckRoot
		copy {
			from 'src/main/resources/blueprint'
			into "$treeCheckRoot/src/main/resources/blueprint"
			exclude '*.md'
		}
	}
	classpath = project(':elasticore-project:elasticore-base').sourceSets.main.runtimeClasspath
	mainClass = 'io.elasticore.base.model.pub.rules.verify.RulesGenRunner'
	systemProperty 'elasticore.base.path', treeCheckRoot.absolutePath
	// The 2.x-compatible code, which is what 2.x's tree is compared with -
	// not the default, which is the 3.0 code since 3.0.261028-rc3.
	systemProperty 'elasticore.rules.v2', 'true'
	jvmArgs '-Dfile.encoding=UTF-8'
	outputs.upToDateWhen { false }
}
task elcoreTreeCheck(type: JavaExec) {
	group = 'elasticore'
	description = 'Compares every 2.x generated file with the rule engine output'
	dependsOn elcoreTreeGenerate
	classpath = project(':elasticore-project:elasticore-base').sourceSets.main.runtimeClasspath
	mainClass = 'io.elasticore.base.model.pub.rules.verify.TreeCheckRunner'
	args "$projectDir/src/main/java", "$treeCheckRoot/src/main/java"
	jvmArgs '-Dfile.encoding=UTF-8'
}

// Prototype (3.0): source generation through the rule pipeline.
// Runs alongside the existing elcore task; both can be used on the same project.
//   ./gradlew elcore3 [-Pdomain=content] [-Pv3|-Pkt|-Pts] [-Pforce]
// elcore3 comes from the plugin, which also passes -Pdomain, -Pv3, -Pkt, -Pts
// and -Pforce. What stays here is the house style, which is particular to this
// module: it is what elcoreRulesCheck compares against, so it must be settable
// per run without becoming part of the plugin's surface.
tasks.named('elcore3') {
	description = 'Generates sources through the 3.0 rule pipeline (-Pv3 clean, -Pkt Kotlin, -Pts TypeScript)'

	// Declare it once in gradle.properties (elasticoreIndent=tab) or pass it
	// per run (-PelasticoreIndent=2). Left unset, files come out exactly as
	// 2.x wrote them.
	[
		elasticoreIndent      : 'elasticore.style.indent',
		elasticoreLineEnding  : 'elasticore.style.lineEnding',
		elasticoreFinalNewline: 'elasticore.style.finalNewline'
	].each { gradleKey, styleKey ->
		if (project.hasProperty(gradleKey)) {
			systemProperty styleKey, project.property(gradleKey)
		}
	}
}

compileJava {
	//dependsOn genModel

}


compileJava.doFirst {
	println 'Starting Java compilation...'
}
