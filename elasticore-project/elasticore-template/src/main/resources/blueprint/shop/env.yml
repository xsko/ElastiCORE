elasticore:
  enable: true
  config:
    domainName: shop
    framework: springboot
    mode: jpa
    j2ee: jakarta
    testCode: "true"
    apiPath: "/api/v1"
    table:
      prefix: shop_
    jpa:
      useQueryMethod: true
    annotations:
      genid: "genid(io.elasticore.springboot3.util.IdUtils.newId)"
      stringarray: "@entity:Convert(converter = io.elasticore.springboot3.util.StringArrayConverter.class)"
      integerarray: "@entity:Convert(converter = io.elasticore.springboot3.util.IntegerArrayConverter.class)"
  namespace:
    entity: io.elasticore.blueprint.domain.shop.entity
    dto: io.elasticore.blueprint.domain.shop.dto
    enumeration: io.elasticore.blueprint.domain.shop.enums
    repository: io.elasticore.blueprint.domain.shop.repository
    service: io.elasticore.blueprint.domain.shop.service
    control: io.elasticore.blueprint.domain.shop.controller
    port: io.elasticore.blueprint.domain.shop.port
