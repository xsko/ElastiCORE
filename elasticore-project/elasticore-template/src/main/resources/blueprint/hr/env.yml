elasticore:
  enable: true
  config:
    domainName: hr
    framework: springboot
    mode: jpa
    j2ee: jakarta
    testCode: "true"
    apiPath: "/api/v1"
    table:
      prefix: hr_
    jpa:
      useQueryMethod: true
    annotations:
      genid: "genid(io.elasticore.springboot3.util.IdUtils.newId)"
      stringarray: "@entity:Convert(converter = io.elasticore.springboot3.util.StringArrayConverter.class)"
      integerarray: "@entity:Convert(converter = io.elasticore.springboot3.util.IntegerArrayConverter.class)"
  namespace:
    entity: io.elasticore.blueprint.domain.hr.entity
    dto: io.elasticore.blueprint.domain.hr.dto
    enumeration: io.elasticore.blueprint.domain.hr.enums
    repository: io.elasticore.blueprint.domain.hr.repository
    service: io.elasticore.blueprint.domain.hr.service
    control: io.elasticore.blueprint.domain.hr.controller
    port: io.elasticore.blueprint.domain.hr.port
