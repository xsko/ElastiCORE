elasticore:
  enable: true
  config:
    domainName: integration
    framework: springboot
    mode: jpa
    j2ee: jakarta
    testCode: "true"
    apiPath: "/api/v1"
    table:
      prefix: intg_
    jpa:
      useQueryMethod: true
    annotations:
      genid: "genid(io.elasticore.springboot3.util.IdUtils.newId)"
  namespace:
    entity: io.elasticore.blueprint.domain.integration.entity
    dto: io.elasticore.blueprint.domain.integration.dto
    enumeration: io.elasticore.blueprint.domain.integration.enums
    repository: io.elasticore.blueprint.domain.integration.repository
    service: io.elasticore.blueprint.domain.integration.service
    control: io.elasticore.blueprint.domain.integration.controller
    port: io.elasticore.blueprint.domain.integration.port
