name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  # The gates of the change, measured against any base - how long the mutation
  # job takes for a change as large as a past one, say. Run from the Actions tab.
  workflow_dispatch:
    inputs:
      base:
        description: 'The commit or branch the change is measured from (the gates compare with its merge base)'
        required: true
        default: origin/main

permissions:
  contents: read

# On a manual run, the base it was given (gradle/quality.gradle reads it as
# -PdiffBase); a pull request's is its base branch.
env:
  ORG_GRADLE_PROJECT_diffBase: ${{ inputs.base }}

jobs:
  # How a pull request records its change (changes/README.md, CONTRIBUTING.md):
  # a fragment in changes/, never the history itself, no committed guide
  # copies. Checked here so a contributor learns it from the pull request -
  # the failure says what to do - rather than from a conflict later.
  change-record:
    name: Change record
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The branch name comes from the contributor; it reaches the script as an
      # environment variable, never as text spliced into the command.
      - name: The change is recorded the way a pull request records it
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: bash .github/scripts/change-record.sh "origin/$BASE_REF" "$HEAD_SHA" "$HEAD_BRANCH"

  # The gates that look at the lines a pull request adds or edits
  # (gradle/quality.gradle): formatted as palantir-java-format formats them, and
  # no Error Prone finding on them - the code older than the gates keeps its
  # format and its warnings. An Error Prone ERROR fails 'build' anywhere.
  # Quick, so a contributor hears of these first.
  static:
    name: Format and static analysis of the change
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch, to compare with
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: The changed lines are formatted, and Error Prone finds nothing on them
        run: ./gradlew formatCheck diffErrorprone --continue --console=plain

      # The fix of a formatting failure is mechanical: what formatChanged would
      # write, shown in the job summary and as a patch to apply
      # (git apply format.patch) - or run ./gradlew formatChanged and commit.
      - name: What formatChanged changes
        if: failure()
        run: |
          ./gradlew formatChanged -q --console=plain > /dev/null 2>&1 || true
          git diff -- '*.java' > format.patch
          if [ -s format.patch ]; then
            {
              echo '### What `./gradlew formatChanged` changes'
              echo
              echo 'Run `./gradlew formatChanged` and commit the result, or apply the artifact **format-patch**: `git apply format.patch`.'
              echo
              echo '```diff'
              head -c 60000 format.patch
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Format patch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore

  # Each mutation of a changed library line that a test runs - a condition
  # negated, a return value replaced, a call removed - must make a test fail
  # (diffMutation, PIT with the changed-lines filter of elasticore-quality-tools).
  # A line no test runs is the coverage step's, in 'build'.
  mutation:
    name: Mutation testing of the change
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Tests detect the mutations of the changed library lines
        run: ./gradlew diffMutation --console=plain

      - name: Mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: '**/build/reports/pitest/'
          if-no-files-found: ignore

  build:
    name: Build, test and compatibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch, for the coverage of the change
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # build = every module's tests (the samples are generated and compiled), the
      # Gradle plugin's tests through elasticore-base:check, and the sources and
      # javadoc jars a release publishes
      - name: Build and test every module
        run: |
          set -o pipefail
          ./gradlew build --continue --console=plain 2>&1 | tee build.log

      # The two checks after this one compare the rule engine with the 2.x
      # generator of the same build, so a change that moves both alike - a model
      # loader they share - passes them. The committed reference tree is what 2.x
      # generated; the build has just regenerated it, and it must be unchanged,
      # with no file changed, removed or added.
      - name: Compatibility - the build left the 2.x reference tree as committed
        run: |
          tree=elasticore-project/elasticore-template/src/main/java
          changed=$(git status --porcelain --untracked-files=all -- "$tree")
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            files=$(printf '%s\n' "$changed" | head -20 | sed 's/%/%25/g' | awk 'BEGIN {ORS = "%0A"} {print}')
            echo "::error title=2.x output changed::The build regenerated the 2.x reference project differently:%0A${files}"
            exit 1
          fi

      # Each sample's blueprint/ holds files the build writes - the Ossie
      # semantic model, the schema - committed so that a reader of the
      # repository sees them. The build has just written them again; a change
      # that moved them without committing the result left a stale copy. The
      # guides and their index are copies of elasticore-base's and are ignored.
      - name: Generated files - the build left every sample's blueprint as committed
        run: |
          changed=$(git status --porcelain --untracked-files=all -- 'elasticore-project/*/src/main/resources/blueprint')
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            files=$(printf '%s\n' "$changed" | head -20 | sed 's/%/%25/g' | awk 'BEGIN {ORS = "%0A"} {print}')
            echo "::error title=Generated file not committed::Regenerate and commit:%0A${files}"
            exit 1
          fi

      # The generated TypeScript, compiled by tsc: the Kotlin sample's model and
      # the pet store's client with the pages that use it. Node is on the runner;
      # the compilers are pinned by each package-lock.json. -Pstrict turns an
      # absent toolchain into a failure instead of a skipped check.
      - name: TypeScript - the generated clients compile
        run: |
          set -o pipefail
          ./gradlew :elasticore-project:elasticore-template-kt:elcore3tsVerify -Pstrict --console=plain 2>&1 | tee -a build.log
          ./gradlew :elasticore-project:elasticore-sample-petstore:webBuild --console=plain 2>&1 | tee -a build.log
          changed=$(git status --porcelain --untracked-files=all -- elasticore-project/elasticore-sample-petstore/src/main/ts)
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "::error title=TypeScript client not committed::elcore3ts wrote the pet store's client differently - regenerate and commit it"
            exit 1
          fi

      - name: Compatibility - rule engine output equals the 2.x output
        run: ./gradlew :elasticore-project:elasticore-template:elcoreRulesCheck -Pstrict --console=plain

      - name: Compatibility - every 2.x generated file
        run: ./gradlew :elasticore-project:elasticore-template:elcoreTreeCheck --console=plain

      # From the test runs of 'build' - the libraries' own and the samples', which
      # run the runtime libraries as an application does. Uncovered changed lines
      # are annotated on the pull request; below 80% the step fails.
      - name: Coverage - tests run the library lines the change adds or edits
        if: github.event_name != 'push'
        run: ./gradlew diffCoverage --console=plain

      - name: Coverage report
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: 'elasticore-project/*/build/reports/jacoco/test/html/'
          if-no-files-found: ignore

      # Reading a job log takes a signed-in GitHub account, so the failing tests and
      # Gradle's own explanation are put in the run summary as annotations.
      - name: Failure summary
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          sed 's/%/%25/g' build.log \
            | awk '/ FAILED$/ {if (n > 0) print buf; buf = $0; n = 4; next}
                   n > 0     {buf = buf "%0A" $0; if (--n == 0) print buf}
                   END       {if (n > 0) print buf}' \
            | head -9 | while IFS= read -r failure; do echo "::error title=Failed::${failure}"; done
          wrong=$(sed -n '/What went wrong:/,/^\* Try:/p' build.log | head -40 | sed 's/%/%25/g' | awk 'BEGIN {ORS = "%0A"} {print}')
          if [ -n "$wrong" ]; then echo "::error title=What went wrong::${wrong}"; fi

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # The generated code and DDL on the databases they are written for, each on
  # Oracle, PostgreSQL and SQL Server in a schema (a user, a database) of its
  # own: the MyBatis shop's API tests and the pet store's flows (the latter
  # from the Flyway migrations the generator wrote), a migration's ALTERs, and
  # Hibernate validating the JPA pet store's generated schema. The passwords
  # are the run's, made from its id: the containers live as long as the job.
  databases:
    name: Oracle, PostgreSQL and SQL Server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: Ci-${{ github.run_id }}-pg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-Ms9
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 30
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Ci${{ github.run_id }}Or
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 10s --health-retries 60
    env:
      ELASTICORE_IT_POSTGRESQL_URL: jdbc:postgresql://localhost:5432/postgres
      ELASTICORE_IT_POSTGRESQL_USER: postgres
      ELASTICORE_IT_POSTGRESQL_PASSWORD: Ci-${{ github.run_id }}-pg
      ELASTICORE_IT_SQLSERVER_URL: jdbc:sqlserver://localhost:1433;encrypt=true;trustServerCertificate=true
      ELASTICORE_IT_SQLSERVER_USER: sa
      ELASTICORE_IT_SQLSERVER_PASSWORD: Ci-${{ github.run_id }}-Ms9
      ELASTICORE_IT_ORACLE_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
      ELASTICORE_IT_ORACLE_USER: system
      ELASTICORE_IT_ORACLE_PASSWORD: Ci${{ github.run_id }}Or
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: The shop, the domain model and the pet store on each database
        run: |
          set -o pipefail
          ./gradlew :elasticore-project:elasticore-template-mybatis:dbTest \
            :elasticore-project:elasticore-template-ddd-mybatis:dbTest \
            :elasticore-project:elasticore-sample-petstore-mybatis:dbTest \
            :elasticore-project:elasticore-sample-petstore:dbTest --continue --console=plain 2>&1 | tee build.log

      # A database the job did not reach would skip its tests and pass; every
      # one of the thirteen classes must have run.
      - name: No database was skipped
        run: |
          shopt -s nullglob
          results=(elasticore-project/*/build/test-results/dbTest/TEST-*.xml)
          files=${#results[@]}
          skipped=""
          if [ "$files" -gt 0 ]; then skipped=$(grep -l 'skipped="[1-9]' "${results[@]}" || true); fi
          echo "$files result files"
          if [ "$files" -lt 13 ] || [ -n "$skipped" ]; then
            echo "::error title=Database tests skipped::$files result files; skipped in: $skipped"
            exit 1
          fi

      - name: Failure summary
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          sed 's/%/%25/g' build.log \
            | awk '/ FAILED$/ {if (n > 0) print buf; buf = $0; n = 4; next}
                   n > 0     {buf = buf "%0A" $0; if (--n == 0) print buf}
                   END       {if (n > 0) print buf}' \
            | head -9 | while IFS= read -r failure; do echo "::error title=Failed::${failure}"; done

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-test-reports
          path: '**/build/reports/tests/dbTest/'
