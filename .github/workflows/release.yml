name: Release

# Pushing a tag v{version} - the version in gradle.properties - builds and checks
# the tagged commit, signs every published artifact, uploads them to Maven
# Central and makes the GitHub release. RELEASING.md has the steps around it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The environment holds the Central token and the signing key; its rules say
    # which tags may use them and who approves.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      state: ${{ steps.central.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # to see which branches hold the tagged commit
          persist-credentials: false

      - name: The tag, the version and the history agree
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]{6}(-(alpha|beta|rc)[0-9]+)?$ ]]; then
            echo "::error::A release tag is v{major}.{minor}.{YYMMDD}, optionally -alpha{n}, -beta{n} or -rc{n}; $tag is not"
            exit 1
          fi
          for property in elasticoreVersion elasticoreReleasedVersion; do
            declared=$(sed -n "s/^$property=//p" gradle.properties | tr -d '\r')
            if [ "$declared" != "$version" ]; then
              echo "::error::$property in gradle.properties is $declared, the tag says $version"; exit 1
            fi
          done
          history=elasticore-project/elasticore-base/src/main/resources/elasticore-guide/elasticore-history.md
          if ! grep -qxF "## $version" "$history"; then
            echo "::error::$history has no '## $version' section"; exit 1
          fi
          held=no
          for branch in $(git branch -r --format='%(refname:short)' | grep -E '^origin/(main|release/.+)$' || true); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then held=yes; fi
          done
          if [ "$held" != yes ]; then
            echo "::error::$tag points at a commit that is on neither main nor a release branch - push the branch first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Tried in seconds, before the build, rather than at the signing step after it.
      # Gradle says only "Could not read PGP secret key" for a key cut short and for a
      # wrong passphrase alike; this says which. Nothing secret is printed.
      - name: The signing key opens with its passphrase
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Signing key::$1"; exit 1; }
          [ -n "$SIGNING_KEY" ] || fail "SIGNING_KEY is empty"
          [ -n "$SIGNING_PASSWORD" ] || fail "SIGNING_PASSWORD is empty"
          case "$SIGNING_KEY" in
            *'-----BEGIN PGP PRIVATE KEY BLOCK-----'*'-----END PGP PRIVATE KEY BLOCK-----'*) ;;
            *) fail "SIGNING_KEY is not a whole armored private key, from -----BEGIN PGP PRIVATE KEY BLOCK----- to -----END PGP PRIVATE KEY BLOCK-----" ;;
          esac
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import 2> /dev/null \
            || fail "SIGNING_KEY does not import - it was probably cut short or altered when pasted"
          echo probe > "$RUNNER_TEMP/probe"
          if ! printf '%s' "$SIGNING_PASSWORD" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
                 --detach-sign --output "$RUNNER_TEMP/probe.sig" "$RUNNER_TEMP/probe" 2> /dev/null; then
            hint=""
            if [[ "$SIGNING_PASSWORD" =~ ^[[:space:]]|[[:space:]]$ ]]; then hint=" It starts or ends with a space or a line break."; fi
            if LC_ALL=C grep -q '[^ -~]' <<< "$SIGNING_PASSWORD"; then
              hint="$hint It has characters outside ASCII, as typing in Korean input mode gives."
            fi
            fail "SIGNING_PASSWORD does not unlock SIGNING_KEY.$hint"
          fi
          echo "Signing key $(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}') opens"
          gpgconf --kill all

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Nothing another run left in the cache reaches a release.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build and test every module
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      # The same check as in CI: the build regenerated the 2.x reference project,
      # and it must come out as committed - no file changed, removed or added.
      - name: Compatibility - the build left the 2.x reference tree as committed
        run: |
          tree=elasticore-project/elasticore-template/src/main/java
          changed=$(git status --porcelain --untracked-files=all -- "$tree")
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            files=$(printf '%s\n' "$changed" | head -20 | sed 's/%/%25/g' | awk 'BEGIN {ORS = "%0A"} {print}')
            echo "::error title=2.x output changed::The build regenerated the 2.x reference project differently:%0A${files}"
            exit 1
          fi

      - name: Compatibility - rule engine output equals the 2.x output
        run: ./gradlew :elasticore-project:elasticore-template:elcoreRulesCheck -Pstrict --console=plain

      - name: Compatibility - every 2.x generated file
        run: ./gradlew :elasticore-project:elasticore-template:elcoreTreeCheck --console=plain

      - name: Sign and bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew centralBundle --console=plain 2>&1 | tee bundle.log

      # USER_MANAGED (the default): Central validates the upload and it waits there
      # for Publish on central.sonatype.com. The environment variable
      # CENTRAL_PUBLISHING_TYPE=AUTOMATIC publishes it as soon as it is valid.
      - name: Upload to Maven Central and wait for it
        id: central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          PUBLISHING_TYPE: ${{ vars.CENTRAL_PUBLISHING_TYPE || 'USER_MANAGED' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          case "$PUBLISHING_TYPE" in
            USER_MANAGED|AUTOMATIC) ;;
            *) echo "::error::CENTRAL_PUBLISHING_TYPE is USER_MANAGED or AUTOMATIC, not $PUBLISHING_TYPE"; exit 1 ;;
          esac
          # The header goes to curl on stdin, so the token is in no command line.
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          api=https://central.sonatype.com/api/v1/publisher
          body="$RUNNER_TEMP/central-response"
          # Central's own words, when it refuses something, as an annotation.
          refused() {
            echo "::error title=$1 (HTTP $2)::$(head -c 3000 "$body" | tr '\r\n' '  ' | sed 's/%/%25/g')"
          }

          code=$(printf 'Authorization: Bearer %s\n' "$token" | curl --silent --show-error --header @- \
                   --output "$body" --write-out '%{http_code}' \
                   --form "bundle=@build/central-bundle.zip;type=application/octet-stream" \
                   "$api/upload?name=elasticore-$VERSION&publishingType=$PUBLISHING_TYPE")
          if [ "$code" != 201 ]; then refused "Central refused the upload" "$code"; exit 1; fi
          id=$(tr -d '[:space:]' < "$body")
          if [ -z "$id" ]; then echo "::error::Central accepted the upload but returned no deployment id"; exit 1; fi
          echo "Deployment $id ($PUBLISHING_TYPE)"

          # Validation takes minutes; reaching Maven Central can take half an hour.
          # A request that fails on the way is asked again; a refusal ends the step.
          for attempt in $(seq 1 120); do
            sleep 30
            code=$(printf 'Authorization: Bearer %s\n' "$token" | curl --silent --show-error --header @- \
                     --output "$body" --write-out '%{http_code}' \
                     --request POST "$api/status?id=$id") || code=000
            case "$code" in
              200) ;;
              429|5??|000) echo "$(date -u +%H:%M:%S) status request failed (HTTP $code), asking again"; continue ;;
              *) refused "Central refused the status request" "$code"; exit 1 ;;
            esac
            state=$(jq -r '.deploymentState' < "$body")
            echo "$(date -u +%H:%M:%S) $state"
            case "$state" in
              PUBLISHED)
                echo "state=$state" >> "$GITHUB_OUTPUT"; exit 0 ;;
              VALIDATED)
                if [ "$PUBLISHING_TYPE" = USER_MANAGED ]; then echo "state=$state" >> "$GITHUB_OUTPUT"; exit 0; fi ;;
              FAILED)
                jq . < "$body"
                echo "::error title=Central refused the deployment::$(jq -c '.errors' < "$body" | sed 's/%/%25/g')"
                exit 1 ;;
            esac
          done
          echo "::error::Deployment $id is still not done after an hour - see https://central.sonatype.com/publishing/deployments"
          exit 1

      # Reading a job log takes a signed-in GitHub account, so the failing tests and
      # Gradle's own explanation are put in the run summary as annotations.
      - name: Failure summary
        if: failure()
        run: |
          if [ -f build.log ]; then
            sed 's/%/%25/g' build.log \
              | awk '/ FAILED$/ {if (n > 0) print buf; buf = $0; n = 4; next}
                     n > 0     {buf = buf "%0A" $0; if (--n == 0) print buf}
                     END       {if (n > 0) print buf}' \
              | head -9 | while IFS= read -r failure; do echo "::error title=Failed::${failure}"; done
          fi
          for log in build.log bundle.log; do
            [ -f "$log" ] || continue
            wrong=$(sed -n '/What went wrong:/,/^\* Try:/p' "$log" | head -40 | sed 's/%/%25/g' | awk 'BEGIN {ORS = "%0A"} {print}')
            if [ -n "$wrong" ]; then echo "::error title=What went wrong ($log)::${wrong}"; fi
          done

  # A job of its own, so the only token that can write to the repository is never
  # in a job that runs the build.
  github:
    name: GitHub release
    needs: central
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from the history, and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.central.outputs.version }}
          STATE: ${{ needs.central.outputs.state }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          history=elasticore-project/elasticore-base/src/main/resources/elasticore-guide/elasticore-history.md
          awk -v head="## $VERSION" '$0 == head {on = 1; next} on && /^## / {exit} on' "$history" > "$notes"
          {
            echo
            echo "Maven Central: \`io.elasticore:elasticore-base:$VERSION\`, \`io.elasticore.springboot3:elasticore-springboot3:$VERSION\`,"
            echo "\`io.elasticore.springboot4:elasticore-springboot4:$VERSION\`, plugin \`id 'io.elasticore' version '$VERSION'\`"
          } >> "$notes"
          # -alpha1, -beta2, -rc1: marked as a pre-release
          kind=()
          if [[ "$VERSION" == *-* ]]; then kind=(--prerelease); fi
          if [ "$STATE" = PUBLISHED ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag "${kind[@]}" \
              --title "ElastiCORE $VERSION" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag "${kind[@]}" --draft \
              --title "ElastiCORE $VERSION" --notes-file "$notes"
            {
              echo "### Waiting for Publish"
              echo "Central validated the upload. Publish it at https://central.sonatype.com/publishing/deployments,"
              echo "then publish the draft GitHub release once the artifacts are on Maven Central."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
